name: "Issues/PRs with Label Alert"

on:
  schedule:
    - cron: "45 5 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

# Customize here
env:
  REPO: hackforla/website
  TYPE: '[ "Issue", "PR" ]' # must be string of array. Exs: '[ "PR" ]', '[ "Issue" ]', or both '[ "PR", "Issue" ]'
  STATUS: '[ "Prioritized backlog" ]' # must be string of array. Exs: '[ "Prioritized backlog" ]', '[ "ERs and epics that are ready to be turned into issues" ]', or both '[ "Prioritized backlog", "ERs and epics that are ready to be turned into issues" ]'
  LABEL: "Complexity: Medium"
  LOOKBACK: "40 days"
  COMMENT_NUMBER: "1"

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: "Find new Issues w/ label"
        if: contains(fromJSON(env.TYPE), 'Issue')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d "$LOOKBACK ago" +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --repo "$REPO" --label "$LABEL" --state open \
          --search "created:>=$SINCE"  --limit 25 --json number,title,author,url,createdAt,assignees \
          --jq 'map({  
            number,
            title,
            author: .author.login,
            url,
            createdAt,
            assignees: [(.assignees // [])[].login]
          })' > issues.json
          if [ ! -s issues.json ]; then 
            echo "issues.json is missing or empty"
            exit 1
          fi
          echo "Length after Issues check: $(jq length issues.json)."
      - name: "Find new PRs w/ label"
        if: contains(fromJSON(env.TYPE), 'PR')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d "$LOOKBACK ago" +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --repo "$REPO" --label "$LABEL" --state open \
          --search "created:>=$SINCE"  --limit 25 --json number,title,author,url,createdAt,reviews,reviewRequests \
          --jq 'map({  
            number,
            title,
            author: .author.login,
            url,
            createdAt,
            reviewers: (([(.reviews // [])[].author.login] + [(.reviewRequests // [])[].login]) | unique)
          })' > prs.json
          if [ ! -s prs.json ]; then 
            echo "prs.json is missing or empty"
            exit 1
          fi
          echo "Length after Issues + PR check: $(jq length prs.json)."
      - name: "Check not author, assignees, or reviewer"
        id: filter
        run: |
          for f in issues.json prs.json; do
            [ -f "$f" ] || echo '[]' > "$f"
          done
          jq -s 'add' issues.json prs.json > issues-and-prs.json  

          TOTAL=$(jq length issues-and-prs.json)
          AVAILABLE=$(jq --arg me "${{github.repository_owner}}" \
            'map(select(
              .author != $me 
              and ((.assignees // []) | length == 0) 
              and (any((.reviewers // [])[]; . == $me) | not)
            ))' issues-and-prs.json)
          COUNT=$(echo "$AVAILABLE" | jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -eq 0 ]; then
            echo "Nothing new."
          elif [ "$COUNT" -eq 0 ]; then
            echo "Nothing new that you don't own or haven't already claimed."
          else
            echo "Available Issues/PRs:"
            echo "Desired Issues/PRs available: " > message.txt
            echo "$AVAILABLE" | jq -r '.[] | "\n\(.number) - \(.title)\nGo to url: \(.url)\nCreated: \(.createdAt)"' >> message.txt
            cat message.txt
          fi
      - name: "Post alert comment"
        if: steps.filter.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment $COMMENT_NUMBER --repo "${{ github.repository }}" --body-file message.txt
